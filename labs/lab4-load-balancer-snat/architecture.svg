<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#D13438"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#107C10"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#333">Lab 4: Load Balancer SNAT vs NAT Gateway</text>

  <!-- Divider -->
  <line x1="480" y1="60" x2="480" y2="530" stroke="#ccc" stroke-width="1" stroke-dasharray="4"/>
  <text x="480" y="555" text-anchor="middle" font-size="12" fill="#999">VS</text>

  <!-- === LEFT: Load Balancer Scenario === -->
  <rect x="40" y="60" width="410" height="480" rx="12" fill="none" stroke="#D13438" stroke-width="2"/>
  <text x="245" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#D13438">Scenario A: LB Outbound Rules</text>

  <!-- LB VM -->
  <rect x="120" y="120" width="200" height="60" rx="8" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
  <text x="220" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Backend VMs (×N)</text>

  <!-- Load Balancer -->
  <rect x="100" y="230" width="280" height="80" rx="8" fill="#FDE7E9" stroke="#D13438" stroke-width="2"/>
  <text x="240" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#D13438">Standard Load Balancer</text>
  <text x="240" y="280" text-anchor="middle" font-size="11" fill="#555">Outbound Rule: 1 Public IP</text>
  <text x="240" y="296" text-anchor="middle" font-size="11" fill="#555">= 64,000 ports shared</text>

  <!-- Port allocation -->
  <rect x="100" y="360" width="280" height="70" rx="8" fill="#FDE7E9" stroke="#D13438" stroke-width="2"/>
  <text x="240" y="388" text-anchor="middle" font-size="14" font-weight="bold" fill="#D13438">1,024 ports / VM</text>
  <text x="240" y="410" text-anchor="middle" font-size="11" fill="#555">(64K ÷ backend pool size)</text>

  <!-- Warning -->
  <rect x="110" y="470" width="260" height="50" rx="6" fill="#FDE7E9" stroke="#D13438" stroke-width="1.5"/>
  <text x="240" y="495" text-anchor="middle" font-size="13" font-weight="bold" fill="#D13438">⚠ SNAT Exhaustion Risk</text>
  <text x="240" y="512" text-anchor="middle" font-size="11" fill="#555">Connections fail under load</text>

  <!-- Arrow VM → LB -->
  <path d="M 220 180 L 220 225" fill="none" stroke="#D13438" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- === RIGHT: NAT Gateway Scenario === -->
  <rect x="510" y="60" width="410" height="480" rx="12" fill="none" stroke="#107C10" stroke-width="2"/>
  <text x="715" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#107C10">Scenario B: NAT Gateway</text>

  <!-- NAT VM -->
  <rect x="640" y="120" width="200" height="60" rx="8" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
  <text x="740" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Backend VMs (×N)</text>

  <!-- NAT Gateway -->
  <rect x="580" y="230" width="280" height="80" rx="8" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
  <text x="720" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#107C10">NAT Gateway</text>
  <text x="720" y="280" text-anchor="middle" font-size="11" fill="#555">1 Public IP</text>
  <text x="720" y="296" text-anchor="middle" font-size="11" fill="#555">Dynamic port allocation</text>

  <!-- Port allocation -->
  <rect x="580" y="360" width="280" height="70" rx="8" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
  <text x="720" y="388" text-anchor="middle" font-size="14" font-weight="bold" fill="#107C10">~64,000 ports / IP</text>
  <text x="720" y="410" text-anchor="middle" font-size="11" fill="#555">(Entire pool available dynamically)</text>

  <!-- Success -->
  <rect x="590" y="470" width="260" height="50" rx="6" fill="#DFF6DD" stroke="#107C10" stroke-width="1.5"/>
  <text x="720" y="495" text-anchor="middle" font-size="13" font-weight="bold" fill="#107C10">✓ No SNAT Exhaustion</text>
  <text x="720" y="512" text-anchor="middle" font-size="11" fill="#555">Scales automatically</text>

  <!-- Arrow VM → NAT -->
  <path d="M 740 180 L 740 225" fill="none" stroke="#107C10" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Key Insight Box -->
  <rect x="40" y="580" width="880" height="80" rx="8" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
  <text x="480" y="608" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">KEY INSIGHT: NAT Gateway Eliminates SNAT Exhaustion</text>
  <text x="480" y="630" text-anchor="middle" font-size="13" fill="#555">LB: 64K ports ÷ N VMs = limited ports per VM (static). NAT GW: ~64K ports available dynamically per IP.</text>
  <text x="480" y="650" text-anchor="middle" font-size="12" fill="#777">Best practice: Use NAT Gateway for outbound-heavy workloads. Add more PIPs for &gt;64K concurrent flows.</text>
</svg>
