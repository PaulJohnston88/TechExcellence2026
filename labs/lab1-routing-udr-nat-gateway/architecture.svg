<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#D13438"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#107C10"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#333">Lab 1: Routing / UDR / NAT Gateway</text>

  <!-- VNet Container -->
  <rect x="40" y="70" width="880" height="460" rx="12" fill="none" stroke="#0078D4" stroke-width="2"/>
  <text x="60" y="95" font-size="14" fill="#0078D4" font-weight="bold">VNet (10.200.0.0/16)</text>

  <!-- Workload Subnet -->
  <rect x="60" y="110" width="380" height="400" rx="8" fill="#F3F9FF" stroke="#0078D4" stroke-width="1" stroke-dasharray="4"/>
  <text x="80" y="135" font-size="12" fill="#555">Workload Subnet (10.200.1.0/24)</text>

  <!-- VM -->
  <rect x="120" y="200" width="200" height="80" rx="8" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
  <text x="220" y="235" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Linux VM</text>
  <text x="220" y="255" text-anchor="middle" font-size="12" fill="#555">10.200.1.4</text>

  <!-- UDR -->
  <rect x="100" y="340" width="260" height="60" rx="8" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/>
  <text x="230" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#F7630C">UDR: 0.0.0.0/0</text>
  <text x="230" y="386" text-anchor="middle" font-size="11" fill="#555">Next Hop → Firewall Private IP</text>

  <!-- NAT Gateway -->
  <rect x="100" y="440" width="260" height="60" rx="8" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
  <text x="230" y="468" text-anchor="middle" font-size="13" font-weight="bold" fill="#107C10">NAT Gateway</text>
  <text x="230" y="486" text-anchor="middle" font-size="11" fill="#555">+ Public IP (predictable egress)</text>

  <!-- Firewall Subnet -->
  <rect x="520" y="110" width="380" height="250" rx="8" fill="#FFF5F5" stroke="#D13438" stroke-width="1" stroke-dasharray="4"/>
  <text x="540" y="135" font-size="12" fill="#555">AzureFirewallSubnet</text>

  <!-- Firewall -->
  <rect x="580" y="180" width="260" height="80" rx="8" fill="#FDE7E9" stroke="#D13438" stroke-width="2"/>
  <text x="710" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#D13438">Azure Firewall</text>
  <text x="710" y="235" text-anchor="middle" font-size="11" fill="#555">Network + Application Rules</text>

  <!-- Firewall PIP -->
  <rect x="600" y="290" width="220" height="50" rx="6" fill="#FDE7E9" stroke="#D13438" stroke-width="1"/>
  <text x="710" y="320" text-anchor="middle" font-size="12" fill="#555">Firewall Public IP</text>

  <!-- Internet -->
  <rect x="560" y="440" width="300" height="70" rx="35" fill="#E8E8E8" stroke="#495057" stroke-width="2"/>
  <text x="710" y="482" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Internet</text>

  <!-- Arrow: VM → UDR → Firewall (red solid) -->
  <path d="M 320 240 L 450 240 L 580 220" fill="none" stroke="#D13438" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="420" y="225" font-size="11" fill="#D13438" font-weight="bold">Active path (UDR)</text>

  <!-- Arrow: Firewall → Internet (red solid) -->
  <path d="M 710 340 L 710 435" fill="none" stroke="#D13438" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow: NAT → Internet (green dashed) -->
  <path d="M 360 470 L 555 470" fill="none" stroke="#107C10" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-green)"/>
  <text x="440" y="458" font-size="11" fill="#107C10" font-weight="bold">When UDR removed</text>

  <!-- Key Insight Box -->
  <rect x="40" y="560" width="880" height="80" rx="8" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/>
  <text x="480" y="590" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">KEY INSIGHT: Egress Priority Order</text>
  <text x="480" y="615" text-anchor="middle" font-size="13" fill="#555">UDR (forces traffic to Firewall) &gt; NAT Gateway (subnet-level) &gt; Default Internet</text>
  <text x="480" y="635" text-anchor="middle" font-size="12" fill="#777">Remove the UDR and outbound IP changes from Firewall PIP → NAT Gateway PIP</text>
</svg>
